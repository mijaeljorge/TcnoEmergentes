<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo de .caja con box-sizing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h2>Con <code>box-sizing: border-box</code></h2>
  <div class="caja">Tamaño total: 200px × 100px</div>

  <h2>Sin <code>box-sizing</code> (content-box)</h2>
  <div class="caja-sin">Tamaño total: 244px × 144px</div>

</body>
</html>
